<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090f">
  <meta name="description" content="VYBE is your personal operating system for a more intentional life.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VYBE — Your life, in focus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="launch-screen" aria-hidden="true">
    <div class="launch-lockup">
      <div class="launch-wordmark">VYBE<span>.</span></div>
      <div class="launch-tagline">YOUR LIFE, IN FOCUS</div>
    </div>
  </div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="Dashboard" aria-label="VYBE home">
        <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
        <span>vybe<span class="brand-period">.</span></span>
      </a>
      <div class="workspace-label">YOUR SPACE</div>
      <nav class="main-nav" id="mainNav" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <button class="profile-button" data-page="Settings">
          <span class="avatar">V</span><span class="profile-copy"><strong>Your profile</strong><small>Personal space</small></span><span class="profile-more">···</span>
        </button>
        <div class="build-credit"><span>Built by</span><strong>Vaibhav</strong></div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" data-action="close-menu" hidden></div>
    <nav class="mobile-bottom-nav" aria-label="Quick navigation">
      <button class="mobile-nav-item" data-page="Dashboard" aria-label="Dashboard"><span class="mobile-nav-icon">⌂</span><small>Home</small></button>
      <button class="mobile-nav-item" data-page="Tasks" aria-label="Tasks"><span class="mobile-nav-icon">☑</span><small>Tasks</small></button>
      <button class="mobile-nav-item" data-page="Planner" aria-label="Planner"><span class="mobile-nav-icon">◷</span><small>Planner</small></button>
      <button class="mobile-nav-item" data-page="AI Studio" aria-label="AI Studio"><span class="mobile-nav-icon">✦</span><small>AI</small></button>
      <button class="mobile-nav-item" data-action="toggle-menu" aria-label="More sections"><span class="mobile-nav-icon">···</span><small>More</small></button>
    </nav>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuToggle" aria-label="Toggle navigation">☰</button>
        <div class="breadcrumbs"><span>VYBE</span><span class="crumb-slash">/</span><strong id="currentPage">Dashboard</strong></div>
        <div class="top-actions">
          <label class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search anything..." autocomplete="off"><kbd>⌘ K</kbd></label>
          <button class="icon-button" id="themeToggle" aria-label="Toggle light theme" title="Toggle theme">☼</button>
          <button class="icon-button notification-button" data-action="show-reminders" aria-label="Notifications" title="Today’s reminders">♧<i></i></button>
          <button class="top-avatar" id="topAvatar" data-page="Settings" aria-label="Open profile settings">V</button>
        </div>
      </header>
      <section class="page-content" id="pageContent" aria-live="polite"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-heading"><div><span class="eyebrow" id="modalEyebrow">YOUR SPACE</span><h2 id="modalTitle">Add something</h2></div><button class="icon-button modal-close" id="modalClose" aria-label="Close dialog">×</button></div>
      <form id="recordForm"><div class="form-fields" id="formFields"></div><div class="modal-actions"><button type="button" class="button button-quiet" id="modalCancel">Cancel</button><button type="submit" class="button button-primary" id="modalSave">Save</button></div></form>
    </section>
  </div>
  <div class="modal-backdrop" id="welcomeBackdrop" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
      <div class="modal-heading"><div><span class="eyebrow">WELCOME TO VYBE</span><h2 id="welcomeTitle">What should we call you?</h2></div></div>
      <p class="welcome-copy">We’ll personalize your greetings. Your name is saved only in this browser.</p>
      <form id="welcomeForm">
        <div class="form-fields">
          <div class="form-field"><label for="welcomeName">Your name</label><input id="welcomeName" name="name" type="text" maxlength="60" autocomplete="name" required></div>
        </div>
        <div class="modal-actions"><button type="submit" class="button button-primary">Continue ↗</button></div>
      </form>
    </section>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <input type="file" id="importInput" accept="application/json,.json" hidden>
</body>
</html>
